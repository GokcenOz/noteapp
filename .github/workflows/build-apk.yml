name: Build Note Bank APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Accept Android SDK licenses
        run: |
          SDKMANAGER=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | head -n 1)
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true

      - name: Restore google-services.json from Secret if missing
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ ! -f app/google-services.json ]; then
            if [ -n "$GOOGLE_SERVICES_JSON" ]; then
              printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json
            else
              echo "::error::app/google-services.json bulunamadı. GitHub Actions Secrets'a GOOGLE_SERVICES_JSON ekleyin."
              exit 1
            fi
          fi

      - name: Prepare debug keystore
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ ! -f debug.keystore ]; then
            if [ -n "$DEBUG_KEYSTORE_BASE64" ]; then
              printf '%s' "$DEBUG_KEYSTORE_BASE64" | tr -cd 'A-Za-z0-9+/=' | base64 -d > debug.keystore || rm -f debug.keystore
            elif [ -f debug.keystore.base64 ]; then
              tr -cd 'A-Za-z0-9+/=' < debug.keystore.base64 | base64 -d > debug.keystore || rm -f debug.keystore
            fi
            if [ ! -s debug.keystore ] || ! keytool -list -keystore debug.keystore -storepass android >/dev/null 2>&1; then
              rm -f debug.keystore
              echo "::warning::Geçerli DEBUG_KEYSTORE_BASE64 okunamadı; geçici imza anahtarı oluşturuluyor."
              keytool -genkeypair -v -keystore debug.keystore -alias androiddebugkey \
                -storepass android -keypass android -keyalg RSA -keysize 2048 \
                -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
            fi
          fi
          keytool -list -v -keystore debug.keystore -alias androiddebugkey -storepass android -keypass android | grep -E "SHA1:|SHA256:" || true

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NoteBank-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Publish APK to GitHub Releases
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="notebank-latest"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" app/build/outputs/apk/debug/app-debug.apk --clobber
          else
            gh release create "$TAG" app/build/outputs/apk/debug/app-debug.apk \
              --title "Note Bank APK" \
              --notes "Telefonunuza doğrudan kurmak için aşağıdaki app-debug.apk dosyasını indirin."
          fi
